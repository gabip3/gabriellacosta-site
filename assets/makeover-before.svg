<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" font-family="'Times New Roman', Times, serif">
  <!-- dull page -->
  <rect width="1600" height="1000" fill="#d9d5c6"/>
  <rect x="60" y="60" width="1480" height="880" fill="#ece7d8" stroke="#9a927a" stroke-width="2"/>

  <!-- garish header -->
  <defs>
    <linearGradient id="ug" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1b3fb0"/><stop offset="0.5" stop-color="#7a2ea0"/><stop offset="1" stop-color="#1b3fb0"/>
    </linearGradient>
  </defs>
  <rect x="60" y="60" width="1480" height="150" fill="url(#ug)"/>
  <text x="90" y="130" fill="#ffe14d" font-size="58" font-weight="bold" font-style="italic">Welcome To Our Website!!!</text>
  <text x="92" y="175" fill="#c9f0ff" font-size="26">~ Your #1 Source Since 1998 ~</text>
  <!-- construction badge -->
  <g transform="translate(1360,95)">
    <polygon points="60,0 120,110 0,110" fill="#f4c400" stroke="#000" stroke-width="4"/>
    <text x="60" y="95" fill="#000" font-size="60" font-weight="bold" text-anchor="middle">!</text>
  </g>

  <!-- blinking NEW! -->
  <g transform="translate(120,250)">
    <rect x="0" y="0" width="150" height="54" fill="#e60000"/>
    <text x="75" y="40" fill="#fff600" font-size="34" font-weight="bold" text-anchor="middle">NEW!!</text>
  </g>

  <!-- red loud banner -->
  <rect x="300" y="250" width="1180" height="56" fill="#ffef9f" stroke="#e60000" stroke-width="3"/>
  <text x="890" y="290" fill="#c00000" font-size="30" font-weight="bold" text-anchor="middle">★ ★ CLICK HERE FOR THE BEST PRICES!! DON'T MISS OUT!! ★ ★</text>

  <!-- left link column -->
  <rect x="120" y="340" width="300" height="520" fill="#dfe8ff" stroke="#7b7b7b" stroke-width="2"/>
  <text x="140" y="380" fill="#00179f" font-size="26" font-weight="bold">Menu:</text>
  <g fill="#0000ee" font-size="24" text-decoration="underline">
    <text x="140" y="430" text-decoration="underline">&gt; Home</text>
    <text x="140" y="472" text-decoration="underline">&gt; About Us</text>
    <text x="140" y="514" text-decoration="underline">&gt; Products</text>
    <text x="140" y="556" text-decoration="underline">&gt; Contact</text>
    <text x="140" y="598" text-decoration="underline">&gt; Guestbook</text>
    <text x="140" y="640" text-decoration="underline">&gt; Links</text>
  </g>
  <!-- visitor counter -->
  <rect x="140" y="700" width="250" height="110" fill="#000"/>
  <text x="160" y="740" fill="#39ff14" font-size="22" font-family="monospace">Visitors:</text>
  <text x="160" y="782" fill="#39ff14" font-size="40" font-family="monospace">0000142</text>

  <!-- cramped main text -->
  <text x="470" y="380" fill="#900" font-size="40" font-weight="bold">WELCOME to our homepage!</text>
  <g fill="#222" font-size="23">
    <text x="470" y="430">We sell many products at great prices. Please look around our</text>
    <text x="470" y="462">website and sign our guestbook before you leave. This site is</text>
    <text x="470" y="494">best viewed in Internet Explorer at 800x600 resolution. If you</text>
    <text x="470" y="526">have any questions email us at contact@ourwebsite.geocities.com</text>
    <text x="470" y="558">Thank you for visiting and please come back again soon!!!</text>
  </g>
  <!-- clip-art-ish clashing boxes -->
  <rect x="470" y="600" width="230" height="180" fill="#00b050" stroke="#000" stroke-width="3"/>
  <text x="585" y="700" fill="#fff" font-size="24" text-anchor="middle" font-weight="bold">SALE!</text>
  <rect x="720" y="600" width="230" height="180" fill="#ff00ff" stroke="#000" stroke-width="3"/>
  <text x="835" y="700" fill="#fff" font-size="22" text-anchor="middle" font-weight="bold">Buy Now</text>
  <rect x="970" y="600" width="230" height="180" fill="#00b0f0" stroke="#000" stroke-width="3"/>
  <text x="1085" y="700" fill="#000" font-size="22" text-anchor="middle" font-weight="bold">Free!!</text>
  <!-- footer -->
  <text x="800" y="900" fill="#555" font-size="20" text-anchor="middle" font-style="italic">Copyright 1998. This page is under construction. Best viewed 800x600.</text>
</svg>
