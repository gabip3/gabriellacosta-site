<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" font-family="'Quicksand','Century Gothic','Avenir Next',system-ui,sans-serif">
  <defs>
    <linearGradient id="heroimg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6B32E0"/><stop offset="1" stop-color="#DB3A8C"/>
    </linearGradient>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#FDF6E9"/>
    </linearGradient>
  </defs>
  <rect width="1600" height="1000" fill="url(#sky)"/>

  <!-- nav -->
  <circle cx="128" cy="118" r="26" fill="#DB3A8C"/>
  <text x="168" y="128" fill="#1A1330" font-size="34" font-weight="700">Studio</text>
  <g fill="#4A4266" font-size="26" font-weight="600">
    <text x="900" y="128">Work</text>
    <text x="1030" y="128">About</text>
    <text x="1160" y="128">Pricing</text>
  </g>
  <rect x="1300" y="90" width="180" height="60" rx="30" fill="#1A1330"/>
  <text x="1390" y="130" fill="#fff" font-size="26" font-weight="700" text-anchor="middle">Let's talk</text>

  <!-- hero text -->
  <text x="130" y="360" fill="#1A1330" font-size="96" font-weight="700" letter-spacing="-3">Grow your</text>
  <text x="130" y="470" fill="#1A1330" font-size="96" font-weight="700" letter-spacing="-3">business <tspan fill="#DB3A8C">online.</tspan></text>
  <text x="132" y="545" fill="#4A4266" font-size="30">A clean, fast website that turns visitors into customers.</text>

  <!-- CTA buttons -->
  <rect x="130" y="600" width="290" height="76" rx="38" fill="#6B32E0"/>
  <text x="275" y="649" fill="#fff" font-size="28" font-weight="700" text-anchor="middle">Get started</text>
  <rect x="446" y="600" width="240" height="76" rx="38" fill="none" stroke="#1A1330" stroke-width="2.5"/>
  <text x="566" y="649" fill="#1A1330" font-size="28" font-weight="700" text-anchor="middle">See work</text>

  <!-- trust row -->
  <g fill="#4A4266" font-size="24" font-weight="600">
    <circle cx="145" cy="760" r="7" fill="#A9CC3D"/><text x="165" y="769">5-day delivery</text>
    <circle cx="405" cy="760" r="7" fill="#A9CC3D"/><text x="425" y="769">Mobile-perfect</text>
    <circle cx="695" cy="760" r="7" fill="#A9CC3D"/><text x="715" y="769">100% yours</text>
  </g>

  <!-- hero visual card -->
  <rect x="980" y="250" width="480" height="520" rx="34" fill="url(#heroimg)"/>
  <circle cx="1220" cy="440" r="110" fill="#FDF6E9" opacity="0.9"/>
  <rect x="1080" y="600" width="300" height="26" rx="13" fill="#FFFFFF" opacity="0.85"/>
  <rect x="1080" y="646" width="220" height="26" rx="13" fill="#FFFFFF" opacity="0.55"/>
  <circle cx="1400" cy="300" r="30" fill="#A9CC3D"/>

  <!-- footer strip -->
  <rect x="0" y="880" width="1600" height="120" fill="#FDF6E9"/>
  <rect x="130" y="922" width="180" height="16" rx="8" fill="#1A1330" opacity="0.35"/>
  <rect x="1300" y="922" width="170" height="16" rx="8" fill="#1A1330" opacity="0.2"/>
</svg>
